; =============================================================================
;  WuaStation-mini -- PlatformIO project for development tools
;
;  The product firmware is an ESPHome build: see wuastation-mini.yaml and
;  components/wuastation. The firmware core (lib/WuaStationCore) is a plain
;  PlatformIO library, so this project also compiles it on its own.
;
;  Environments
;    c3_bench : FPS benchmark of the LED pipeline (WiFi off)
; =============================================================================

[platformio]
default_envs = c3_bench

[env:c3_bench]
; pioarduino platform -> Arduino-ESP32 core 3.3.7 (ESP-IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
build_type = release

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed = 921600

; The core library (lib/WuaStationCore) brings its own dependencies.
build_flags =
    -I src
    ; Native USB (IO18/IO19): Serial is the USB-CDC port
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; WuaDisplay-LMX backend: LMX1p panoramic panel, DIN on GPIO5.
    ; These must be global flags so the library sees the same values.
    -D WUA_BOARD_LMX1P
    -D LMX1P_LED_PIN=5
    -D WUA_ENABLE_EFFECTS
    -O2
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=0
    -D WUA_ENABLE_DEBUG
    -D WUA_ENABLE_BENCHMARK
