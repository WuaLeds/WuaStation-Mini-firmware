; =============================================================================
;  WuaStation-mini firmware
;  ESP32-C3-WROOM-02-N4 + LMX1p panoramic LED matrix (18x7 SK6805)
;
;  Environments
;    c3_release : production build (default)
;    c3_debug   : verbose logs + built-in USB-JTAG debugging
;    c3_bench   : FPS benchmark of the LED pipeline (WiFi off)
; =============================================================================

[platformio]
default_envs = c3_release

; -----------------------------------------------------------------------------
;  Common settings
; -----------------------------------------------------------------------------
[env]
; pioarduino platform -> Arduino-ESP32 core 3.3.7 (ESP-IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
; 4 MB flash: 2 x 1.9 MB app slots (OTA-ready) + small SPIFFS
board_build.partitions = min_spiffs.csv

; Embeds web/settings.html (gzipped) as src/web/SettingsPageData.h
extra_scripts = pre:tools/embed_web.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed = 921600

build_flags =
    -I src
    ; Native USB (IO18/IO19): Serial is the USB-CDC port
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; WuaDisplay-LMX backend: LMX1p panoramic panel, DIN on GPIO5.
    ; These must be global flags so the library sees the same values.
    -D WUA_BOARD_LMX1P
    -D LMX1P_LED_PIN=5
    -D WUA_ENABLE_EFFECTS

; FastLED is listed before WuaDisplay-LMX so the pinned version also satisfies
; the library's own (unversioned) FastLED dependency.
lib_deps =
    fastled/FastLED@3.10.3
    adafruit/Adafruit GFX Library@^1.12.6
    https://github.com/WuaLeds/WuaDisplay-LMX.git#1d8f55554a048c2d1f6ad2cfd5ebb3dcfe3f7793
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@^7.4.2
    adafruit/Adafruit BME280 Library@^2.2.4

; -----------------------------------------------------------------------------
;  Release
; -----------------------------------------------------------------------------
[env:c3_release]
build_type = release
build_flags =
    ${env.build_flags}
    -Os
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=0

; -----------------------------------------------------------------------------
;  Debug (logs over USB-CDC, debugger over the ESP32-C3 built-in USB-JTAG)
; -----------------------------------------------------------------------------
[env:c3_debug]
build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak setup
debug_build_flags = -Og -g3 -ggdb
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=3
    -D WUA_ENABLE_DEBUG
    ; -D WUA_WAIT_FOR_SERIAL   ; uncomment to wait for the monitor at boot

; -----------------------------------------------------------------------------
;  Benchmark (FPS of the display pipeline, no network)
; -----------------------------------------------------------------------------
[env:c3_bench]
build_type = release
build_flags =
    ${env.build_flags}
    -O2
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=0
    -D WUA_ENABLE_DEBUG
    -D WUA_ENABLE_BENCHMARK
