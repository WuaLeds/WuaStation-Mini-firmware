name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  ESPHOME_VERSION: "2026.10.2"
  # Same version as the one in .clang-format: newer releases may format
  # slightly differently.
  CLANG_FORMAT_VERSION: "23.1.5"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install "clang-format==$CLANG_FORMAT_VERSION"

      - name: Check formatting
        run: |
          git ls-files 'lib/*.h' 'lib/*.cpp' 'components/*.h' 'components/*.cpp' 'src/*.h' 'src/*.cpp' \
            | xargs clang-format --dry-run --Werror
          echo "All sources match .clang-format."

  esphome:
    name: ESPHome firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-${{ hashFiles('lib/WuaStationCore/library.json') }}
          restore-keys: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome
        run: pip install "esphome==$ESPHOME_VERSION"

      - name: Check versions
        run: python tools/check_version.py

      - name: Validate configuration
        run: esphome -s components_source components config wuastation-mini.yaml > /dev/null

      - name: Build
        run: esphome -s components_source components compile wuastation-mini.yaml

      # The same files a release attaches, to test a pull request on a board
      # (Windows cannot build the Bluetooth stack: its command lines get too long).
      - name: Collect firmware files
        run: python tools/release_assets.py "ci-${GITHUB_SHA::7}" wuastation-mini dist

      - uses: actions/upload-artifact@v4
        with:
          name: wuastation-mini-firmware
          path: dist/
          retention-days: 14

  bench:
    name: Benchmark (PlatformIO)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'lib/WuaStationCore/library.json') }}
          restore-keys: ${{ runner.os }}-pio-

      # The pioarduino build scripts import their Python dependencies (littlefs,
      # fatfs, yaml, ...) in the Python that runs PlatformIO, and on Linux that
      # Python does not always see pioarduino's own environment. Same list as
      # python_deps in the platform's builder/penv_setup.py (55.03.37).
      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio
          pip install "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Build c3_bench
        run: pio run -e c3_bench
