name: Release

# Builds the firmware of a GitHub release with ESPHome, attaches the files the
# web flasher installs (bootloader, partitions, boot_app0, app + manifest.json,
# plus the merged factory image) and asks Vercel to rebuild wualeds.com, which
# picks the new version up at build time.
#
# For tags from v0.4 on (ESPHome builds). Earlier tags were PlatformIO builds
# and already have their files attached.
#
# Runs by itself when a release is published. "Run workflow" rebuilds an
# existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.4)
        required: true
      allow_version_mismatch:
        description: Build even if the firmware version does not match the tag
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  ESPHOME_VERSION: "2026.10.2"
  # Build description ESPHome writes for wuastation-mini.yaml (flash images, offsets)
  IDEDATA: .esphome/idedata/wuastation-mini.json
  PIO_ENV: wuastation-mini

jobs:
  release:
    name: Build ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest

    steps:
      # Release tooling from this workflow's revision, firmware from the tag.
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: fw

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Firmware version, ESPHome project version, the component source that
      # Home Assistant users get and the tag must all agree.
      - name: Check firmware version
        working-directory: fw
        env:
          ALLOW_MISMATCH: ${{ inputs.allow_version_mismatch || false }}
        run: |
          if ! python tools/check_version.py "$TAG"; then
            if [ "$ALLOW_MISMATCH" = "true" ]; then echo "::warning::version mismatch allowed"; else exit 1; fi
          fi

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-${{ hashFiles('fw/lib/WuaStationCore/library.json') }}
          restore-keys: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome
        run: pip install "esphome==$ESPHOME_VERSION"

      # The component comes from this checkout (the tag), not from GitHub.
      - name: Build firmware
        working-directory: fw
        run: esphome -s components_source components compile wuastation-mini.yaml

      - name: Collect release files
        working-directory: fw
        run: python ../ci/tools/release_assets.py "$TAG" "$PIO_ENV" ../dist "$IDEDATA"

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Rebuild wualeds.com
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set: the website shows this release on its next deploy."
          else
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Website rebuild requested."
          fi
